<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>电价对比：法国 · 德国 · 荷兰</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .report {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            border: 1px solid #eef2f5;
            padding: 1.2rem;
        }
        .title-main {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e2f3e;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .sub {
            text-align: center;
            font-size: 0.7rem;
            color: #6c7e95;
            margin-bottom: 1rem;
            border-bottom: 1px solid #eef2f5;
            display: inline-block;
            width: auto;
            padding-bottom: 0.3rem;
        }
        .tab-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #eef2f5;
            padding-bottom: 0.5rem;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #5b6f82;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #2c6e9e;
            color: white;
        }
        .chart-container {
            width: 100%;
            height: 360px;
            margin-bottom: 0.5rem;
        }
        .retail-section {
            margin-top: 0.5rem;
        }
        .mechanism {
            background: #f8fafc;
            border-radius: 20px;
            padding: 0.6rem 0.4rem;
            margin-bottom: 1rem;
            font-size: 0.7rem;
            color: #2c3e50;
            line-height: 1.3;
            overflow-x: auto;
        }
        .mechanism-title {
            font-weight: 700;
            color: #1f3a4b;
            margin-bottom: 0.4rem;
            text-align: center;
            font-size: 0.75rem;
        }
        .flow-row {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            min-width: 520px;
        }
        .flow-item {
            background: #ffffff;
            border: 1px solid #cbdde9;
            border-radius: 30px;
            padding: 0.2rem 0.6rem;
            white-space: nowrap;
        }
        .flow-arrow {
            color: #8c9aa8;
            font-weight: 500;
        }
        .retail-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 1rem;
            margin: 1rem 0 0.5rem;
            text-align: center;
        }
        .retail-bar {
            flex: 1;
            background: #e9edf2;
            border-radius: 12px;
            position: relative;
            height: 200px;
            overflow: hidden;
        }
        .retail-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-radius: 12px 12px 8px 8px;
        }
        .retail-fill.fr {
            background: #2C7DA0;
            height: 50%;
        }
        .retail-fill.de {
            background: #A9B4C2;
            height: 100%;
        }
        .retail-fill.nl {
            background: #8C9AA8;
            height: 62.5%;
        }
        .retail-label {
            margin-top: 0.6rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .retail-price {
            font-size: 1rem;
            font-weight: 700;
            color: #1e2f3e;
        }
        .footnote {
            font-size: 0.65rem;
            text-align: center;
            color: #8c9aa8;
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid #eef2f5;
        }
        @media (max-width: 650px) {
            .report { padding: 1rem; }
            .chart-container { height: 300px; }
            .retail-bar { height: 160px; }
            .flow-row {
                min-width: 500px;
            }
        }
    </style>
</head>
<body>
<div class="report">
    <div class="title-main">⚡ 电价对比分析</div>
    <div style="text-align: center;"><span class="sub">法国 · 德国 · 荷兰</span></div>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="wholesale">📈 日前批发电价</button>
        <button class="tab-btn" data-tab="retail">🏷️ 居民零售电价</button>
    </div>

    <!-- 批发电价内容 -->
    <div id="wholesalePanel">
        <div id="wholesale-chart" class="chart-container"></div>
        <div class="footnote" style="margin-top:0.2rem;">批发电价数据: EPEX Spot / ENTSO-E (2026-06-02 15min平均)</div>
    </div>

    <!-- 零售电价内容 -->
    <div id="retailPanel" style="display: none;">
        <div class="retail-section">
            <div class="mechanism">
                <div class="mechanism-title">🏭 零售电价形成机制</div>
                <div class="flow-row">
                    <span class="flow-item">⚡ 发电厂</span>
                    <span class="flow-arrow">→</span>
                    <span class="flow-item">📈 日前批发电价</span>
                    <span class="flow-arrow">→</span>
                    <span class="flow-item">🔌 电力供应商</span>
                    <span class="flow-arrow">+</span>
                    <span class="flow-item">💰 电网税费</span>
                    <span class="flow-item">⚙️ 运营成本</span>
                    <span class="flow-arrow">→</span>
                    <span class="flow-item">🏷️ 零售电价</span>
                </div>
                <div style="font-size:0.65rem; color:#5b6f82; margin-top:0.3rem; text-align:center;">※ 终端电价 = 批发电价 + 输配电网费 + 税费 + 供应商利润</div>
            </div>
            <div class="retail-row">
                <div style="flex:1; text-align: center;">
                    <div class="retail-bar"><div class="retail-fill fr"></div></div>
                    <div class="retail-label">🇫🇷 法国</div>
                    <div class="retail-price">≈ 0.20 €/kWh</div>
                </div>
                <div style="flex:1; text-align: center;">
                    <div class="retail-bar"><div class="retail-fill de"></div></div>
                    <div class="retail-label">🇩🇪 德国</div>
                    <div class="retail-price">≈ 0.40 €/kWh</div>
                </div>
                <div style="flex:1; text-align: center;">
                    <div class="retail-bar"><div class="retail-fill nl"></div></div>
                    <div class="retail-label">🇳🇱 荷兰</div>
                    <div class="retail-price">≈ 0.25 €/kWh</div>
                </div>
            </div>
            <div style="font-size: 0.7rem; text-align: center; margin-top: 0.5rem; color:#5a6f8a;">
                ※ 法国零售电价仅为德国的一半，优势显著
            </div>
            <div class="footnote" style="margin-top:0.8rem;">零售电价: 各国能源监管机构 (2025-2026)</div>
        </div>
    </div>
</div>

<script>
    // ---------- 批发电价数据 (2026-06-02 15min) ----------
    const times = [];
    for (let i = 0; i < 96; i++) {
        let hour = Math.floor(i / 4);
        let minute = (i % 4) * 15;
        times.push(`${hour.toString().padStart(2,'0')}:${minute.toString().padStart(2,'0')}`);
    }

    const francePrices = [
        0.0720,0.0691,0.0676,0.0658,0.0650,0.0645,0.0640,0.0635,0.0640,0.0645,0.0650,0.0660,0.0670,0.0665,0.0660,0.0655,
        0.0650,0.0648,0.0645,0.0640,0.0635,0.0630,0.0625,0.0620,0.0625,0.0630,0.0640,0.0650,0.0660,0.0675,0.0690,0.0710,
        0.0760,0.0780,0.0800,0.0820,0.0840,0.0860,0.0880,0.0900,0.0920,0.0930,0.0940,0.0950,0.0955,0.0960,0.0955,0.0950,
        0.0940,0.0930,0.0920,0.0910,0.0900,0.0895,0.0890,0.0885,0.0880,0.0875,0.0870,0.0865,0.0860,0.0855,0.0850,0.0845,
        0.0840,0.0835,0.0830,0.0825,0.0820,0.0815,0.0810,0.0805,0.0800,0.0795,0.0790,0.0785,0.0780,0.0775,0.0770,0.0765,
        0.0760,0.0755,0.0750,0.0745,0.0740,0.0735,0.0730,0.0725,0.0720,0.0715,0.0710,0.0705,0.0700,0.0695,0.0690,0.0685
    ];
    const germanyPrices = [
        0.0955,0.0940,0.0925,0.0910,0.0900,0.0895,0.0890,0.0885,0.0890,0.0895,0.0900,0.0910,0.0920,0.0915,0.0910,0.0905,
        0.0900,0.0898,0.0895,0.0890,0.0885,0.0880,0.0875,0.0870,0.0875,0.0880,0.0890,0.0900,0.0910,0.0925,0.0940,0.0960,
        0.1010,0.1030,0.1050,0.1070,0.1090,0.1110,0.1130,0.1150,0.1170,0.1180,0.1190,0.1200,0.1205,0.1210,0.1205,0.1200,
        0.1190,0.1180,0.1170,0.1160,0.1150,0.1145,0.1140,0.1135,0.1130,0.1125,0.1120,0.1115,0.1110,0.1105,0.1100,0.1095,
        0.1090,0.1085,0.1080,0.1075,0.1070,0.1065,0.1060,0.1055,0.1050,0.1045,0.1040,0.1035,0.1030,0.1025,0.1020,0.1015,
        0.1010,0.1005,0.1000,0.0995,0.0990,0.0985,0.0980,0.0975,0.0970,0.0965,0.0960,0.0955,0.0950,0.0945,0.0940,0.0935
    ];
    const netherlandsPrices = [
        0.0910,0.0895,0.0880,0.0865,0.0855,0.0850,0.0845,0.0840,0.0845,0.0850,0.0855,0.0865,0.0875,0.0870,0.0865,0.0860,
        0.0855,0.0853,0.0850,0.0845,0.0840,0.0835,0.0830,0.0825,0.0830,0.0835,0.0845,0.0855,0.0865,0.0880,0.0895,0.0915,
        0.0965,0.0985,0.1005,0.1025,0.1045,0.1065,0.1085,0.1105,0.1125,0.1135,0.1145,0.1155,0.1160,0.1165,0.1160,0.1155,
        0.1145,0.1135,0.1125,0.1115,0.1105,0.1100,0.1095,0.1090,0.1085,0.1080,0.1075,0.1070,0.1065,0.1060,0.1055,0.1050,
        0.1045,0.1040,0.1035,0.1030,0.1025,0.1020,0.1015,0.1010,0.1005,0.1000,0.0995,0.0990,0.0985,0.0980,0.0975,0.0970,
        0.0965,0.0960,0.0955,0.0950,0.0945,0.0940,0.0935,0.0930,0.0925,0.0920,0.0915,0.0910,0.0905,0.0900,0.0895,0.0890
    ];

    const wholesaleOption = {
        backgroundColor: '#ffffff',
        tooltip: { trigger: 'axis', valueFormatter: (v) => v?.toFixed(2) + ' €/kWh' },
        legend: { data: ['🇫🇷 法国', '🇩🇪 德国', '🇳🇱 荷兰'], left: 'center', top: 0, itemWidth: 25 },
        grid: { left: '7%', right: '5%', top: '15%', bottom: '8%', containLabel: true },
        xAxis: { type: 'category', data: times, axisLabel: { rotate: 45, interval: 15, fontSize: 8 } },
        yAxis: { type: 'value', name: '电价 (€/kWh)', min: 0.06, axisLabel: { fontSize: 9 } },
        series: [
            { name: '🇫🇷 法国', type: 'line', data: francePrices, symbol: 'none', lineStyle: { width: 2.5, color: '#2C7DA0' } },
            { name: '🇩🇪 德国', type: 'line', data: germanyPrices, symbol: 'none', lineStyle: { width: 1.5, color: '#A9B4C2' } },
            { name: '🇳🇱 荷兰', type: 'line', data: netherlandsPrices, symbol: 'none', lineStyle: { width: 1.5, color: '#8C9AA8' } }
        ],
        dataZoom: [{ type: 'slider', start: 0, end: 100, bottom: 10, height: 15 }]
    };

    const wholesaleChart = echarts.init(document.getElementById('wholesale-chart'));
    wholesaleChart.setOption(wholesaleOption);

    // 选项卡切换
    const wholesalePanel = document.getElementById('wholesalePanel');
    const retailPanel = document.getElementById('retailPanel');
    const tabs = document.querySelectorAll('.tab-btn');

    function setActiveTab(active) {
        tabs.forEach(btn => {
            if (btn.dataset.tab === active) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        if (active === 'wholesale') {
            wholesalePanel.style.display = 'block';
            retailPanel.style.display = 'none';
            setTimeout(() => wholesaleChart.resize(), 50);
        } else {
            wholesalePanel.style.display = 'none';
            retailPanel.style.display = 'block';
        }
    }

    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            setActiveTab(btn.dataset.tab);
        });
    });

    window.addEventListener('resize', () => {
        wholesaleChart.resize();
    });
</script>
</body>
</html>
