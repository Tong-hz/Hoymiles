<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>欧洲电力低碳对比 · 窄版大图</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;   /* 白底 */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        /* 窄卡片，白底无阴影 */
        .poster {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 1.5rem 1rem 1rem;
            border: 1px solid #eef2f5;
        }

        .title-main {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1e2f3e;
            text-align: center;
            margin-bottom: 1.2rem;
            letter-spacing: -0.3px;
        }

        /* 法国区块 */
        .france-block {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            background: #ffffff;
            padding: 0.2rem 0.5rem;
        }
        .chart-area-fr {
            flex-shrink: 0;
            position: relative;
            width: 180px;
            height: 180px;
        }
        .center-text-fr {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-weight: 700;
            font-size: 1.7rem;
            color: #1f3a4b;
            pointer-events: none;
            background: rgba(255,255,255,0.8);
            border-radius: 50px;
            padding: 0.1rem 0.3rem;
            white-space: nowrap;
        }
        .center-text-fr small {
            font-size: 0.7rem;
            font-weight: normal;
            display: block;
            color: #4a627a;
        }
        .stats-area {
            flex: 1;
            min-width: 110px;
        }
        .country-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .ranking {
            background: #e9f0f5;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #2c6e9e;
        }

        /* 德荷双列：饼图加大 */
        .compare-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 0.2rem;
        }
        .country-card {
            flex: 1;
            min-width: 150px;
            background: #ffffff;
            border-radius: 20px;
            padding: 0.5rem 0.3rem 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .chart-wrapper-sm {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }
        .center-text-sm {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 700;
            font-size: 1.3rem;
            color: #1f3a4b;
            background: rgba(255,255,255,0.8);
            border-radius: 30px;
            padding: 0.1rem 0.2rem;
            white-space: nowrap;
        }
        .center-text-sm small {
            font-size: 0.65rem;
            font-weight: normal;
            display: block;
        }

        .footer {
            margin-top: 1rem;
            font-size: 0.7rem;
            text-align: center;
            color: #8c9aa8;
            border-top: 1px solid #eef2f5;
            padding-top: 0.8rem;
        }

        @media (max-width: 560px) {
            .poster { padding: 1rem; }
            .chart-area-fr { width: 150px; height: 150px; }
            .chart-wrapper-sm { width: 130px; height: 130px; }
            .center-text-fr { font-size: 1.4rem; }
            .center-text-sm { font-size: 1.1rem; }
            .title-main { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="poster">
    <div class="title-main">⚡ 电力低碳占比 · 欧盟对比</div>

    <!-- 法国 -->
    <div class="france-block">
        <div class="chart-area-fr">
            <canvas id="franceChart" width="180" height="180"></canvas>
            <div class="center-text-fr">95%<small>低碳电力</small></div>
        </div>
        <div class="stats-area">
            <div class="country-title">
                🇫🇷 法国 <span class="ranking">欧洲排名 #4</span>
            </div>
        </div>
    </div>

    <!-- 德国 + 荷兰 -->
    <div class="compare-row">
        <div class="country-card">
            <div class="country-title" style="justify-content: center;">🇩🇪 德国</div>
            <div class="chart-wrapper-sm">
                <canvas id="germanyChart" width="150" height="150"></canvas>
                <div class="center-text-sm">56%<small>低碳</small></div>
            </div>
        </div>
        <div class="country-card">
            <div class="country-title" style="justify-content: center;">🇳🇱 荷兰</div>
            <div class="chart-wrapper-sm">
                <canvas id="netherlandsChart" width="150" height="150"></canvas>
                <div class="center-text-sm">52%<small>低碳</small></div>
            </div>
        </div>
    </div>

    <div class="footer">
        低碳电力 = 核电 + 风电 + 太阳能 + 水电 + 生物质 | IEA
    </div>
</div>

<script>
    (function() {
        const franceLabels = [
            '核电 (Nuclear)', '水电 (Hydro)', '风电 (Wind)', '太阳能 (Solar)',
            '生物质 (Bioenergy)', '天然气 (Natural gas)', '煤电 (Coal)', '燃油 (Oil)'
        ];
        const franceValues = [68, 9, 9, 6, 3, 2.5, 2, 0.5];
        const franceColors = [
            '#2C7DA0', '#3A7CA5', '#4C9A8C', '#F4D03F',
            '#9B6B43', '#A9B4C2', '#8C9AA8', '#D97706'
        ];

        const germanyLabels = [
            '风电 (Wind)', '太阳能 (Solar)', '生物质 (Bioenergy)', '水电 (Hydro)',
            '煤电 (Coal)', '天然气 (Natural gas)', '石油 (Oil)', '其他化石 (Other fossil)'
        ];
        const germanyValues = [28.9, 19.0, 3.7, 4.5, 20.7, 16.3, 0.8, 3.0];
        const germanyColors = [
            '#4C9A8C', '#F4D03F', '#9B6B43', '#2B9EB3',
            '#6C757D', '#3B9E6D', '#D97706', '#A9A9A9'
        ];

        const netherlandsLabels = [
            '风电 (Wind)', '太阳能 (Solar)', '生物质 (Bioenergy)', '核能 (Nuclear)',
            '煤电 (Coal)', '天然气 (Natural gas)', '石油 (Oil)', '其他化石 (Other fossil)'
        ];
        const netherlandsValues = [24.3, 19.4, 5.1, 2.9, 9.1, 36.4, 1.1, 1.3];
        const netherlandsColors = [
            '#4C9A8C', '#F4D03F', '#9B6B43', '#2C7DA0',
            '#6C757D', '#3B9E6D', '#D97706', '#A9A9A9'
        ];

        function createDoughnut(ctx, labels, values, colors, cutout, radius = '85%') {
            return new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 0,
                        cutout: cutout,
                        radius: radius,
                        hoverOffset: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            enabled: true,
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    let value = context.raw;
                                    let total = context.dataset.data.reduce((a,b) => a + b, 0);
                                    let percent = ((value / total) * 100).toFixed(1);
                                    return `${label}: ${value}% (占比 ${percent}%)`;
                                }
                            }
                        }
                    },
                    events: ['mousemove', 'mouseout', 'click', 'touchstart', 'touchmove']
                }
            });
        }

        window.addEventListener('load', () => {
            const frCanvas = document.getElementById('franceChart');
            const deCanvas = document.getElementById('germanyChart');
            const nlCanvas = document.getElementById('netherlandsChart');

            if (frCanvas) createDoughnut(frCanvas.getContext('2d'), franceLabels, franceValues, franceColors, '68%', '80%');
            if (deCanvas) createDoughnut(deCanvas.getContext('2d'), germanyLabels, germanyValues, germanyColors, '65%', '75%');
            if (nlCanvas) createDoughnut(nlCanvas.getContext('2d'), netherlandsLabels, netherlandsValues, netherlandsColors, '65%', '75%');
        });
    })();
</script>
</body>
</html>
